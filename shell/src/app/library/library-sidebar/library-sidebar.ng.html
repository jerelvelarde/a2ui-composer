<div class="library-sidebar">
  <a2ui-composer-section-label>Widget Library</a2ui-composer-section-label>

  <button
    mat-stroked-button
    class="save-draft-button"
    [disabled]="!canSave()"
    (click)="saveCurrentDraft()"
  >
    Save current draft
  </button>

  @if (widgets().length === 0) {
    <a2ui-composer-empty-state
      class="library-empty"
      title="No saved widgets yet"
      description="Save the current draft to start building your widget library."
    ></a2ui-composer-empty-state>
  } @else {
    <mat-list class="library-list">
      @for (widget of widgets(); track widget.id) {
        <mat-list-item class="library-item">{{ widget.name }}</mat-list-item>
      }
    </mat-list>
  }
</div>

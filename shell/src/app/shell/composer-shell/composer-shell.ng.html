<div class="composer-bg" aria-hidden="true">
  <span class="blur-circle blur-circle--1"></span>
  <span class="blur-circle blur-circle--2"></span>
  <span class="blur-circle blur-circle--3"></span>
  <span class="blur-circle blur-circle--4"></span>
  <span class="blur-circle blur-circle--5"></span>
  <span class="blur-circle blur-circle--6"></span>
</div>

<mat-toolbar class="composer-header">
  <button
    mat-icon-button
    class="hamburger-button"
    (click)="sidenav.toggle()"
    aria-label="Toggle sidenav"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>
  <div class="header-brand">
    <span class="header-title">A2UI Composer</span>
    @if (activeCatalogTitle()) {
      <a2ui-composer-badge
        class="header-catalog-chip"
        tone="accent"
        [matTooltip]="activeCatalogDescription() || ''"
        >{{ activeCatalogTitle() }}</a2ui-composer-badge
      >
    }
  </div>
  <span class="spacer"></span>
  <div class="header-actions">
    <a2ui-composer-renderer-picker class="header-renderer-picker"></a2ui-composer-renderer-picker>
    <a2ui-composer-button variant="primary" class="reset-session-button" (click)="resetSession()">
      New Session
    </a2ui-composer-button>
    <button
      mat-icon-button
      class="theme-toggle-button"
      (click)="toggleTheme()"
      [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon aria-hidden="true">{{ isDarkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-sidenav-container class="composer-sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="!isNarrow()"
    class="composer-sidenav"
  >
    <nav class="composer-nav">
      <mat-nav-list>
        <a2ui-composer-section-label>Build</a2ui-composer-section-label>
        <a
          mat-list-item
          routerLink="/"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{exact: true}"
          (click)="closeOnNarrow(sidenav)"
          >Composer Workspace</a
        >

        <a2ui-composer-section-label>Browse</a2ui-composer-section-label>
        <a
          mat-list-item
          routerLink="/gallery"
          routerLinkActive="nav-item-active"
          (click)="closeOnNarrow(sidenav)"
          >Components Gallery</a
        >
        <a
          mat-list-item
          routerLink="/widget-gallery"
          routerLinkActive="nav-item-active"
          (click)="closeOnNarrow(sidenav)"
          >Widget Gallery</a
        >
        <a
          mat-list-item
          routerLink="/icons"
          routerLinkActive="nav-item-active"
          (click)="closeOnNarrow(sidenav)"
          >Icon Browser</a
        >

        <a2ui-composer-section-label>Play</a2ui-composer-section-label>
        <a
          mat-list-item
          routerLink="/scenario-player"
          routerLinkActive="nav-item-active"
          (click)="closeOnNarrow(sidenav)"
          >Scenario Player</a
        >
      </mat-nav-list>

      <a2ui-composer-library-sidebar></a2ui-composer-library-sidebar>

      <mat-nav-list class="composer-nav-settings">
        <a2ui-composer-section-label>Settings</a2ui-composer-section-label>
        <a
          mat-list-item
          routerLink="/settings"
          routerLinkActive="nav-item-active"
          (click)="closeOnNarrow(sidenav)"
          >Settings</a
        >
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="composer-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

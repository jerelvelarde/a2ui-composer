<div class="widget-gallery-container">
  <header class="widget-gallery-header">
    <h1 class="widget-gallery-title">Widget Gallery</h1>
    <p class="widget-gallery-subtitle">
      Finished A2UI widgets, rendered read-only. Open a card to preview it live.
    </p>
  </header>

  <div class="widget-gallery-body" [class.has-preview]="selectedPreset()">
    <div class="widget-grid" role="list">
      @for (preset of presets; track preset.id) {
        <a2ui-composer-card
          class="widget-card"
          [interactive]="true"
          role="listitem"
          tabindex="0"
          [class.is-selected]="selectedPreset()?.id === preset.id"
          [attr.aria-pressed]="selectedPreset()?.id === preset.id"
          (click)="openCard(preset)"
          (keydown.enter)="openCard(preset)"
          (keydown.space)="openCard(preset)"
        >
          <div class="widget-card-body">
            <h3 class="widget-card-title">{{ preset.name }}</h3>
            <p class="widget-card-description">{{ preset.description }}</p>
          </div>
          <div class="widget-card-actions">
            <a2ui-composer-button
              variant="secondary"
              type="button"
              class="widget-clone-button"
              [attr.aria-label]="'Clone ' + preset.name + ' to library'"
              (click)="cloneToLibrary($event, preset)"
              (keydown.enter)="$event.stopPropagation()"
              (keydown.space)="$event.stopPropagation()"
            >
              Clone to library
            </a2ui-composer-button>
          </div>
        </a2ui-composer-card>
      }
    </div>

    @if (selectedPreset(); as preset) {
      <aside class="widget-preview-panel" aria-label="Widget preview">
        <div class="widget-preview-heading">
          <h2 class="widget-preview-title">{{ preset.name }}</h2>
          <a2ui-composer-button
            variant="ghost"
            type="button"
            class="widget-preview-close"
            aria-label="Close preview"
            (click)="closePreview()"
          >
            Close
          </a2ui-composer-button>
        </div>
        <div class="widget-preview" [style.min-height.px]="preset.height">
          <a2ui-composer-rendered-frame></a2ui-composer-rendered-frame>
        </div>
      </aside>
    }
  </div>
</div>

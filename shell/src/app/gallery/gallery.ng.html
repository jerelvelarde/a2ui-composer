<div class="gal-page">
  <header class="gal-header">
    <h1 class="gal-title">Gallery</h1>
    <p class="gal-subtitle">
      Composed example widgets from the A2UI basic catalog, each rendered live on its own native
      surface.
    </p>
  </header>

  <div class="gal-masonry">
    @for (entry of widgets; track entry.widget.id) {
      <figure class="gal-card">
        <figcaption class="gal-caption">{{ entry.widget.name }}</figcaption>
        <div class="gal-surface" [style.min-height.px]="entry.height">
          <a2ui-v09-surface [surfaceId]="entry.widget.id"></a2ui-v09-surface>
        </div>
      </figure>
    }
  </div>
</div>
